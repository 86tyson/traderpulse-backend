# Lock Railway / Nixpacks to a Node-only build path. Without this, Nixpacks
# can occasionally pick up co-located frontend artifacts (Vite, Next.js,
# Tailwind configs) and inject a wrong build step. Declaring the phases
# explicitly forces the deploy to: install Node 20 → install prod deps →
# run `npm start`. No Next.js build, no Vite build, no TypeScript compile.

providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install --omit=dev --no-audit --no-fund"]

[phases.build]
# Empty — there is nothing to build. The server runs raw `node src/server.js`.
cmds = []

[start]
cmd = "npm start"
